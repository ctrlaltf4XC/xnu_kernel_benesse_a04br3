name: Begonia source kernel
on:
  workflow_dispatch:
    inputs:
      keep_ssh:
        description: Keep SSH available for bounded incremental repairs
        type: boolean
        default: false
      repair_minutes:
        description: Maximum SSH repair window in minutes (1 to 300)
        type: number
        default: 180
      defer_initial_build:
        description: Start SSH first for an optional validated work-cache restore
        type: boolean
        default: false
permissions:
  contents: read
  statuses: write
jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 360
    env:
      DEVELOPER_DIR: /Applications/Xcode_15.4.app/Contents/Developer
    steps:
      - name: Validate deferred build mode
        if: ${{ inputs.defer_initial_build }}
        env:
          KEEP_SSH: ${{ inputs.keep_ssh }}
        run: |
          test "$KEEP_SSH" = true || { echo 'Deferred build requires keep_ssh'; exit 2; }
      - name: Copy this source revision without Git history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir source out
          curl -fL -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/${{ github.repository }}/tarball/${{ github.sha }}" -o "$RUNNER_TEMP/source.tar.gz"
          tar -xzf "$RUNNER_TEMP/source.tar.gz" --strip-components=1 -C source
      - name: Build committed source and declared dependencies
        id: kernel
        if: ${{ !inputs.defer_initial_build }}
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 source/build-support/build.py --out "$PWD/out/kernel" --install-kdk 2>&1 | tee out/build.log
      - name: Preserve build products and logs
        if: ${{ always() && !inputs.defer_initial_build }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: begonia-kernel-${{ github.sha }}
          path: |
            out/kernel/kernel.development.begonia
            out/kernel/build.json
            out/build.log
          if-no-files-found: warn
          retention-days: 7
      - name: Report the automated build result
        if: always()
        run: |
          python3 - <<'PYTHON'
          import hashlib, json
          from pathlib import Path
          root=Path('out/kernel')
          if not (root/'build.json').is_file():
              print('No build.json produced'); raise SystemExit(1)
          metadata=json.loads((root/'build.json').read_text())
          kernel=root/'kernel.development.begonia'
          assert metadata.get('full_kernel_built') is True, 'No completed kernel build'
          assert metadata.get('source_commit'), 'Missing source revision'
          assert kernel.is_file(), 'Kernel binary missing'
          assert hashlib.sha256(kernel.read_bytes()).hexdigest()==metadata['kernel_sha256'], 'Kernel metadata mismatch'
          print('Verified completed kernel from source '+metadata['source_commit'])
          PYTHON